spring.application.name=bookstorebackend
spring.jpa.show-sql=true

# database on softala.haaga-helia.fi (same as kolehmainenbookstore)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/iinak?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=iinak
spring.datasource.password=password
# update keeps users and books across restarts
spring.jpa.hibernate.ddl-auto=update

# port used in the cloud
server.port=8090

server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.ssl.key-store=/etc/ssl/private/springboot-example.p12
server.ssl.key-store-password=changeit

# email (credentials from environment variables MAIL_USERNAME and MAIL_PASSWORD)
spring.mail.host=mail.kapsi.fi
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT signing secret, at least 32 characters. If empty, a random secret is
# generated at startup and everyone has to log in again after a restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

# React frontend: password reset links point here, and CORS allows these origins
app.frontend-url=https://kolehmainen-works.github.io/bookstorefrontend.github.io
app.cors.allowed-origins=https://kolehmainen-works.github.io,http://localhost:5173
